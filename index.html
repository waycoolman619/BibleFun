<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Fun - v2.0.4</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body onclick="GameManager.unlockAudio()">
    <div id="splash-intro">
        <div class="splash-title-wrap">
            <div class="splash-lights" aria-hidden="true">
                <span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span>
                <span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span>
                <span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span>
                <span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span>
                <span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span>
                <span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span>
                <span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span>
                <span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span>
                <span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span>
                <span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span>
            </div>
            <h1 class="splash-title">Bible Fun</h1>
        </div>
        <p class="splash-line splash-line-1">Have Epic battles with friends.</p>
        <p class="splash-line splash-line-2">Quiz yourself.</p>
        <p class="splash-line splash-line-3">Have fun.</p>
        <button type="button" class="splash-enter" onclick="GameManager.enterFromSplash()">Enter</button>
    </div>

    <div id="video-intro-container" class="hidden">
        <video id="intro-video">
            <source src="default-video.mp4" type="video/mp4">
        </video>
        <audio id="jeopardy-intro-speech" preload="auto">
            <source src="sounds/jeopardy-intro.mp3" type="audio/mpeg">
        </audio>
        <button class="skip-btn" onclick="JeopardyGame.skipVideo()">Skip Intro</button>
    </div>

    <div class="game-container hidden" id="main-app">
        <header class="menu-header">
            <h1 class="menu-title">Bible Fun</h1>
            <p id="app-subtitle" class="app-subtitle">Choose your game</p>
        </header>
        <div id="menu">
            <button class="btn menu-btn" onclick="GameManager.openSetup('multiple')">Trivia Quest</button>
            <button class="btn menu-btn" onclick="GameManager.openSetup('blank')">Fill in the Blank</button>
            <button class="btn menu-btn" onclick="GameManager.openSetup('whoami')">Who Am I?</button>
            <button class="btn menu-btn menu-btn-jeopardy" onclick="GameManager.openSetup('jeopardy')">Bible Jeopardy</button>
            <button class="btn menu-btn" onclick="GameManager.openSetup('match')">Prophetic Pairs</button>
            <button class="btn menu-btn" onclick="GameManager.openSetup('sequence')">Testament Timeline</button>
            <div class="volume-container">
                <div class="sound-switch-row">
                    <span class="volume-label">Sound</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="sound-on" checked onchange="GameManager.toggleSoundDisplay()">
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="sound-state-label" id="sound-state-label">On</span>
                </div>
                <div id="volume-slider-wrap" class="volume-slider-wrap">
                    <label class="volume-label" for="volume-slider">Volume</label>
                    <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.1" value="0.8">
                </div>
            </div>
        </div>

        <div id="setup-screen" class="hidden">
            <div id="dynamic-setup-container"></div>
            <button class="btn-outline" onclick="GameManager.goToMenu()">Back to Menu</button>
        </div>

        <div id="game-intro-splash" class="game-intro-splash hidden">
            <h2 id="game-intro-splash-title" class="game-intro-splash-title">Trivia Quest</h2>
            <p id="game-intro-splash-subtitle" class="game-intro-splash-subtitle">Get ready…</p>
        </div>

        <div id="jeopardy-board" class="hidden">
            <div id="j-turn-display"></div>
            <div id="j-choose-row" class="j-choose-row"></div>
            <div id="j-grid" class="jeopardy-grid"></div>
            <button class="btn-outline" onclick="GameManager.goToMenu()">Quit Board</button>
        </div>

        <div id="j-clue-splash" class="j-clue-splash hidden" onclick="JeopardyGame.dismissClueSplash()">
            <p id="j-clue-splash-text" class="j-clue-splash-text"></p>
        </div>

        <div id="game-play" class="hidden">
            <div class="status-bar">
                <span id="display-player-name"></span>
                <span>Score: <b id="score">0</b></span>
            </div>
            <div class="card">
                <p id="question-box" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
                <div id="options-container"></div>
                <p id="feedback" style="font-weight:bold; margin-top:15px; min-height: 1.2em;"></p>
            </div>
        </div>

        <div id="finish-screen" class="hidden">
            <h2 id="winner-declaration">Wonderful!</h2>
            <div id="final-results-list"></div>
            <button class="btn" onclick="GameManager.goToMenu()">Return to Menu</button>
        </div>
    </div>

    <audio id="sound-correct" preload="auto"><source src="sounds/correct.mp3" type="audio/mpeg"></audio>
    <audio id="sound-wrong" preload="auto"><source src="sounds/wrong.mp3" type="audio/mpeg"></audio>

    <script src="data/questions.js"></script>
    <script src="js/core.js"></script>
    <script src="js/game-trivia.js"></script>
    <script src="js/game-jeopardy.js"></script>
    <script src="js/game-blanks.js"></script>
    <script src="js/game-whoami.js"></script>
    <script src="js/game-matching.js"></script>
    <script src="js/game-sequence.js"></script>
</body>
</html>
